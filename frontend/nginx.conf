server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api/* to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for HLS segment streaming
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        
        # Keep long-lived HLS connections open
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Ensure Range headers are passed to backend
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Never cache index.html so browsers always pick up the new hashed JS/CSS bundles
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    # SPA fallback — hashed assets can be cached indefinitely
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
